openapi: 3.2.0
info:
  title: Inkeep Chat API
  summary: Inkeep Search and Chat API
  description: Inkeep is an AI-powered search and chat platform
  version: 0.1.0
servers:
- url: https://api.inkeep.com
  description: Production server
tags:
- name: Chat Completions
paths:
  /v1/chat/completions:
    post:
      summary: Chat Completions
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Chat Completions
components:
  schemas:
    ToolChoice:
      properties:
        function:
          additionalProperties: true
          type: object
          title: Function
      type: object
      title: ToolChoice
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ChatCompletionRequestBody:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/Message-Input'
          type: array
          title: Messages
        model:
          type: string
          title: Model
        frequency_penalty:
          anyOf:
          - {}
          - type: 'null'
          title: Frequency Penalty
        logit_bias:
          anyOf:
          - {}
          - type: 'null'
          title: Logit Bias
        logprobs:
          anyOf:
          - {}
          - type: 'null'
          title: Logprobs
        top_logprobs:
          anyOf:
          - {}
          - type: 'null'
          title: Top Logprobs
        max_tokens:
          anyOf:
          - {}
          - type: 'null'
          title: Max Tokens
        max_completion_tokens:
          anyOf:
          - {}
          - type: 'null'
          title: Max Completion Tokens
        n:
          anyOf:
          - {}
          - type: 'null'
          title: N
        presence_penalty:
          anyOf:
          - {}
          - type: 'null'
          title: Presence Penalty
        response_format:
          anyOf:
          - {}
          - type: 'null'
          title: Response Format
        seed:
          anyOf:
          - {}
          - type: 'null'
          title: Seed
        stop:
          anyOf:
          - {}
          - type: 'null'
          title: Stop
        stream:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Stream
          default: false
        stream_options:
          anyOf:
          - {}
          - type: 'null'
          title: Stream Options
        temperature:
          anyOf:
          - {}
          - type: 'null'
          title: Temperature
        top_p:
          anyOf:
          - {}
          - type: 'null'
          title: Top P
        tools:
          anyOf:
          - {}
          - type: 'null'
          title: Tools
        tool_choice:
          anyOf:
          - $ref: '#/components/schemas/ToolChoice'
          - type: string
          - type: 'null'
          title: Tool Choice
        user:
          anyOf:
          - {}
          - type: 'null'
          title: User
      type: object
      required:
      - messages
      - model
      title: ChatCompletionRequestBody
    Message-Input:
      properties:
        role:
          type: string
          title: Role
        content:
          anyOf:
          - type: string
          - items:
              additionalProperties: true
              type: object
            type: array
          title: Content
      type: object
      required:
      - role
      - content
      title: Message
