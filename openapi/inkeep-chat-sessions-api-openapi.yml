openapi: 3.2.0
info:
  title: Inkeep Chat Sessions API
  summary: Inkeep Search and Chat API
  description: Inkeep is an AI-powered search and chat platform
  version: 0.1.0
servers:
- url: https://api.inkeep.com
  description: Production server
tags:
- name: Chat Sessions
paths:
  /v0/chat_sessions/chat_results:
    post:
      summary: Create Chat Session And Chat Result
      operationId: createChatSessionAndChatResult
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionAndChatResultInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResult'
                anyOf:
                - $ref: '#/components/schemas/ChatResult'
                - $ref: '#/components/schemas/ChatResultStreamResponse'
                title: Response Createchatsessionandchatresult
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatResultStreamResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Chat Sessions
  /v0/chat_sessions/{chat_session_id}/chat_results:
    post:
      summary: Continue Chat Session And Chat Result
      operationId: continueChatSessionAndChatResult
      parameters:
      - name: chat_session_id
        in: path
        required: true
        schema:
          type: string
          title: Chat Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueChatSessionAndChatResultInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ChatResult'
                - $ref: '#/components/schemas/ChatResultStreamResponse'
                title: Response Continuechatsessionandchatresult
                $ref: '#/components/schemas/ChatResult'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatResultStreamResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Chat Sessions
components:
  schemas:
    RecordCited:
      properties:
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          title: Citations
      type: object
      required:
      - citations
      title: RecordCited
    ContinueChatSessionAndChatResultInput:
      properties:
        integration_id:
          type: string
          title: Integration Id
        message:
          $ref: '#/components/schemas/ChatMessageInput'
        stream:
          type: boolean
          title: Stream
          default: false
      type: object
      required:
      - integration_id
      - message
      title: ContinueChatSessionAndChatResultInput
    Record:
      properties:
        type:
          $ref: '#/components/schemas/RecordType'
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        title:
          type: string
          title: Title
        breadcrumbs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Breadcrumbs
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - type
      - url
      - title
      - breadcrumbs
      - description
      title: Record
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ChatResult:
      properties:
        chat_session_id:
          type: string
          title: Chat Session Id
        message:
          $ref: '#/components/schemas/Message-Output'
      type: object
      required:
      - chat_session_id
      - message
      title: ChatResult
    Citation:
      properties:
        number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Number
        record:
          anyOf:
          - $ref: '#/components/schemas/Record'
          - type: 'null'
        hit_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Hit Url
      type: object
      required:
      - number
      - record
      - hit_url
      title: Citation
    Message-Output:
      properties:
        role:
          type: string
          const: assistant
          title: Role
        content:
          type: string
          title: Content
        records_cited:
          $ref: '#/components/schemas/RecordCited'
      type: object
      required:
      - role
      - content
      - records_cited
      title: Message
    ChatResultStreamResponse:
      properties:
        event:
          type: string
          enum:
          - message_chunk
          - records_cited
          title: Event
        data:
          anyOf:
          - $ref: '#/components/schemas/MessageChunk'
          - $ref: '#/components/schemas/RecordCited'
          title: Data
      type: object
      required:
      - event
      - data
      title: ChatResultStreamResponse
    ChatMessageInput:
      properties:
        role:
          type: string
          const: user
          title: Role
        content:
          type: string
          title: Content
      type: object
      required:
      - role
      - content
      title: ChatMessageInput
    CreateChatSessionAndChatResultInput:
      properties:
        integration_id:
          type: string
          title: Integration Id
        chat_session:
          $ref: '#/components/schemas/ChatSessionInput'
        chat_mode:
          type: string
          title: Chat Mode
          default: auto
        stream:
          type: boolean
          title: Stream
          default: false
      type: object
      required:
      - integration_id
      - chat_session
      title: CreateChatSessionAndChatResultInput
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ChatSessionInput:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/ChatMessageInput'
          type: array
          title: Messages
        context:
          anyOf:
          - type: string
          - type: 'null'
          title: Context
        guidance:
          anyOf:
          - type: string
          - type: 'null'
          title: Guidance
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
      type: object
      required:
      - messages
      title: ChatSessionInput
    RecordType:
      type: string
      enum:
      - documentation
      - site
      - discourse_post
      - github_issue
      - github_discussion
      - stackoverflow_question
      - discord_forum_post
      - discord_message
      - custom_question_answer
      title: RecordType
    MessageChunk:
      properties:
        chat_session_id:
          type: string
          title: Chat Session Id
        content_chunk:
          type: string
          title: Content Chunk
        finish_reason:
          anyOf:
          - type: string
            enum:
            - stop
            - length
            - content_filter
          - type: 'null'
          title: Finish Reason
      type: object
      required:
      - chat_session_id
      - content_chunk
      - finish_reason
      title: MessageChunk
x-provenance:
  method: harvested
  publisher: Inkeep
  source: https://api.inkeep.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
